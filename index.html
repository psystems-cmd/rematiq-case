<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Assessment · Prototype</title>
<link rel="icon" href="assets/icon.svg">
<style>
/* PAS: SECTION 1 · Styles */
/* PAS: WHY colour is reserved for the five triage levels; everything else stays neutral */
:root {
  --bg: #f2f0f6;
  --card: #ffffff;
  --ink: #2e1a33;
  --muted: #74687a;
  --line: #e4e0ea;
  --red: #d64541;
  --orange: #ea8a2a;
  --purple: #7c55c8;
  --green: #2e9b68;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
h1 { font-size: 26px; margin: 4px 0; }
h2 { font-size: 18px; margin: 24px 0 8px; }
.card h2 { margin-top: 4px; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }

.banner { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 8px 16px; background: var(--ink); color: #fff; font: 12px var(--mono); }
.banner nav { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.banner nav a { padding: 2px 10px; border-radius: 6px; text-decoration: none; opacity: .7; }
.banner nav a.active { background: rgba(255, 255, 255, .18); opacity: 1; }
.banner button { font: inherit; color: #fff; background: none; border: 1px solid rgba(255, 255, 255, .5); border-radius: 6px; padding: 2px 10px; cursor: pointer; }

.label { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.big { font-size: 34px; font-weight: 700; line-height: 1.1; margin-top: 8px; }
.card { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(46, 26, 51, .06); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { font: inherit; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .3; cursor: not-allowed; }
select, textarea { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
textarea { width: 100%; min-height: 56px; }

.badge { font: 10px var(--mono); text-transform: uppercase; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); white-space: nowrap; vertical-align: middle; }
/* PAS: WHY simulated output gets a hatched background so it never looks like validated data */
.badge.sim, .sim { background: repeating-linear-gradient(135deg, #fff 0 6px, #f1edf5 6px 12px); }
.badge.sim { border-color: var(--ink); color: var(--ink); }
.sim { border: 1px dashed var(--ink); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--bg); font: 11px var(--mono); white-space: nowrap; }
.chip.overdue { background: var(--ink); color: #fff; }

/* Triage levels: .lv is a small swatch, .cell is a matrix cell; the colour classes come last so they win */
.lv { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 2px solid transparent; vertical-align: middle; }
.cell { display: inline-block; width: 40px; height: 28px; line-height: 24px; border-radius: 6px; border: 2px solid transparent; font: 10px var(--mono); color: #fff; text-decoration: none; }
.cell.dim { opacity: .15; }
.lv-red { background: var(--red); }
.lv-orange { background: var(--orange); }
.lv-purple { background: var(--purple); }
.lv-greenOutline { background: #fff; border-color: var(--green); color: var(--green); }
.lv-green { background: var(--green); }

.scroll { overflow-x: auto; }
.matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
.matrix th, .matrix td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: top; }
.matrix th:first-child, .matrix td:first-child { text-align: left; min-width: 180px; }
.matrix tr.cat td { background: var(--bg); }

.ev { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.ev.checked { border-color: var(--ink); }
.ev blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); }
.todo { margin: 6px 0; padding: 6px 10px; border: 1px dashed var(--muted); border-radius: 8px; font-style: italic; }

table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th, table.list td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
dl.form { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 8px 0; }
dl.form dt { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 3px; }
dl.form dd { margin: 0; }

@media (max-width: 640px) {
  main { padding: 16px 10px 48px; }
  .banner nav { margin-left: 0; }
  dl.form { grid-template-columns: 1fr; }
}
</style>

// PAS: SECTION 3 · Triage rules
// PAS: WHY this order is also the board's sort order: most urgent first, done last
const LEVELS = ['red', 'orange', 'purple', 'greenOutline', 'green'];
const LEVEL_LABEL = {
  red: 'Applies, no SOP',
  orange: 'SOP exists, not assessed',
  purple: 'Unclear, needs expert',
  greenOutline: 'Not applicable, sign-off needed',
  green: 'Done',
};

function daysLeft(iso) {
  return Math.round((Date.parse(iso) - Date.parse(DATA.today)) / 86400000);
}

// PAS: WHY dates already passed show "overdue" instead of a negative number
function deadlineChip(iso) {
  const days = daysLeft(iso);
  return days < 0 ? '<span class="chip overdue">overdue</span>' : `<span class="chip">${days} days</span>`;
}

function sopCovering(reqId) {
  return DATA.sops.find(s => s.covers.includes(reqId));
}

// PAS: SIMULATED the "AI call" is a fixed rule plus fixed reasoning text, no model call
function aiCall(p, r) {
  // PAS: WHY no battery means not applicable for every requirement: the regulation only reaches batteries
  if (!p.hasBattery) {
    return { applies: false, colour: 'greenOutline',
      reasoning: `${p.name} has no battery (${p.battery}). The Battery Regulation does not reach it.` };
  }
  // PAS: WHY R7 and R8 are not applicable: they cover other battery types, never portable ones
  if (r.portable === 'not-applicable') {
    return { applies: false, colour: 'greenOutline',
      reasoning: `${p.name} has a portable battery. ${r.article} only covers ${r.scopeText}.` };
  }
  if (r.id === 'R5') return removabilityCall(p);
  return readinessCall(p, r);
}

function removabilityCall(p) {
  // PAS: WHY a battery that is already user-changeable likely meets Art. 11 by design
  if (p.userChangeable) {
    return { applies: true, colour: 'green',
      reasoning: `The battery in ${p.name} is already user-changeable, so Art. 11 is likely met by design.` };
  }
  // PAS: WHY built-in battery on a continuously used device: an exemption for continuous power may apply, an expert decides
  if (p.continuousUse) {
    return { applies: true, colour: 'purple',
      reasoning: `${p.name} has a built-in battery and is used continuously. Art. 11(3) lists exemptions that may cover it; Regulatory Affairs must decide.` };
  }
  // PAS: WHY otherwise removability applies and the fix is a design change, so the case goes to R&D
  return { applies: true, colour: 'red', productChange: true,
    reasoning: `${p.name} has a built-in battery and no exemption is in sight. Making it removable is a product change, not a document change.` };
}

function readinessCall(p, r) {
  const sop = sopCovering(r.id);
  // PAS: WHY no SOP addresses the requirement: red, someone must write or extend one
  if (!sop) {
    return { applies: true, colour: 'red',
      reasoning: `${r.title} applies to the portable battery in ${p.name}. No SOP in the library addresses it.` };
  }
  // PAS: WHY an SOP that already passed a detailed assessment means done
  if (sop.assessed.includes(r.id)) {
    return { applies: true, colour: 'green',
      reasoning: `${r.title} applies to ${p.name}. ${sop.id} covers it and passed a detailed assessment.` };
  }
  return { applies: true, colour: 'orange',
    reasoning: `${r.title} applies to ${p.name}. ${sop.id} addresses it, but no detailed assessment has checked it yet.` };
}

// PAS: WHY assumed facts lower confidence; an assumed "no battery" is the one fact that could hide a wrong "not applicable"
function confidenceFor(p, call) {
  if (call.colour === 'purple') return 'low';
  if (p.batteryTag !== 'A') return 'high';
  return p.hasBattery ? 'medium' : 'low';
}

function buildCase(p, r) {
  const call = aiCall(p, r);
  call.confidence = confidenceFor(p, call);
  // PAS: DEMO a "not applicable" never rests on an assumed fact: low confidence turns the call purple
  if (call.confidence === 'low' && call.colour !== 'purple') {
    call.colour = 'purple';
    call.reasoning += ' This fact is assumed, not verified, so the AI does not call it not applicable.';
  }
  return { id: p.id + '-' + r.id, productId: p.id, reqId: r.id, ai: call,
    colour: call.colour, owner: null, confirmed: false, signedBy: null };
}

function buildCases() {
  const cases = {};
  DATA.products.forEach(p => {
    DATA.requirements.forEach(r => {
      const c = buildCase(p, r);
      cases[c.id] = c;
    });
  });
  return cases;
}

// Routing rules: who takes the case next, and why
function suggestOwner(c) {
  const r = requirement(c.reqId);
  if (c.colour === 'green') return null;
  // PAS: WHY a product change goes to R&D: the fix is a design change; Q&R keeps tracking it
  if (c.ai.productChange && c.colour === 'red') {
    return { owner: 'tobias', reason: 'Fix is a design change; Q&R keeps tracking it' };
  }
  if (c.colour === 'purple') return { owner: 'jonas', reason: 'Interprets unclear rules' };
  if (c.colour === 'greenOutline') return { owner: 'jonas', reason: 'Signs off not applicable' };
  if (c.colour === 'orange' && sopCovering(r.id)) {
    const sop = sopCovering(r.id);
    return { owner: sop.owner, reason: `Owns ${sop.id}; runs the Detailed Assessment` };
  }
  if (c.colour === 'red' && r.starter) {
    return { owner: r.starter.owner, reason: `Owns ${r.starter.extendSop}` };
  }
  return { owner: 'jonas', reason: 'No SOP owner known; Regulatory Affairs decides' };
}

// Evidence shown on a case: the product fact, the regulation text, and the SOP search
function productEvidenceId(p) {
  return p.evidence || 'ev-' + p.id;
}

function evidenceIds(c) {
  const p = product(c.productId);
  const r = requirement(c.reqId);
  const ids = [productEvidenceId(p)];
  if (!p.hasBattery) return ids;
  ids.push(r.evidence);
  if (r.portable === 'not-applicable') ids.push('ev-art3');
  if (r.sopSearch) ids.push('sop-' + r.id);
  return ids;
}

// Most cards live in DATA.evidence; product facts without a public source and SOP searches are built here
function getEvidence(id) {
  if (DATA.evidence[id]) return DATA.evidence[id];
  if (id.startsWith('sop-')) {
    const r = requirement(id.slice(4));
    // PAS: SIMULATED SOP search result over the illustrative SOP library
    return { claim: `SOP search for ${r.id} ${r.short}`, excerpt: `Searched ${DATA.sops.length} SOPs. Closest match: ${r.sopSearch.closest}, ${r.sopSearch.finding}`,
      location: 'SOP library', tag: 'I', status: 'Simulated search over an illustrative library' };
  }
  const p = product(id.slice(3));
  const where = p.sku ? `philips.de catalogue, ${p.sku}` : 'No catalogue match';
  const note = p.batteryTag === 'A' ? 'Assumed from the product family; no public source matched yet.' : `Listed in the philips.de catalogue as ${p.use}.`;
  return { claim: `${p.name}: ${p.battery}`, excerpt: null, note, location: where, tag: p.batteryTag, status: p.batteryTag === 'A' ? 'No public source yet' : 'Catalogue listing' };
}

// PAS: WHY the board sorts by colour first, then by deadline: the most urgent open work comes first
function compareCases(a, b) {
  const byColour = LEVELS.indexOf(a.colour) - LEVELS.indexOf(b.colour);
  if (byColour !== 0) return byColour;
  return requirement(a.reqId).from.localeCompare(requirement(b.reqId).from);
}

// PAS: WHY cases are grouped by reason: nine products with the same QR-code gap are one decision, not nine
function groupLabel(c) {
  const p = product(c.productId);
  if (!p.hasBattery) return p.batteryTag === 'A' ? 'No battery (assumed)' : 'No battery';
  const r = requirement(c.reqId);
  const suffix = c.ai.productChange && c.colour === 'red' ? ' (product change)' : '';
  return `${r.id} · ${r.short}${suffix}`;
}

// Open cases (everything not green), grouped by colour and reason, most urgent group first
function caseGroups() {
  const groups = [];
  allCases().filter(c => c.colour !== 'green').sort(compareCases).forEach(c => {
    const key = c.colour + ' · ' + groupLabel(c);
    let group = groups.find(g => g.key === key);
    if (!group) {
      group = { key, colour: c.colour, label: groupLabel(c), cases: [] };
      groups.push(group);
    }
    group.cases.push(c);
  });
  return groups;
}

// A deadline chip only makes sense when the whole group shares one requirement
function groupDeadline(g) {
  const reqIds = new Set(g.cases.map(c => c.reqId));
  return reqIds.size === 1 ? deadlineChip(requirement(g.cases[0].reqId).from) : '';
}

// PAS: SECTION 4 · State and helpers
// PAS: WHY state lives in memory only: no database, no browser storage; reload or "Reset demo" starts over
let state = freshState();

function freshState() {
  return {
    cases: buildCases(),  // one case per product × requirement
    checked: {},          // evidence id → true once a human ticked "Checked"
    sopRequests: [],      // requests created from the new-SOP starter
    starterMode: {},      // requirement id → 'extend' or 'create'
    openGroup: null,      // routing group whose panel is open
    mineOnly: false,      // "Needs my decision" filter on the board
    log: [],              // audit log, newest first
  };
}

function resetDemo() {
  state = freshState();
  location.hash = '#intake';
  render();
}

function allCases() {
  return Object.values(state.cases);
}

function plural(count, word) {
  return `${count} ${word}${count === 1 ? '' : 's'}`;
}

function caseName(c) {
  return `${product(c.productId).name} × ${c.reqId}`;
}

function addLog(actor, text) {
  const time = new Date().toLocaleTimeString('en-GB');
  state.log.unshift({ time, actor, text });
}

function product(id) {
  return DATA.products.find(p => p.id === id);
}

function requirement(id) {
  return DATA.requirements.find(r => r.id === id);
}

function personName(id) {
  return id ? DATA.people[id].name : 'nobody';
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

function esc(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text).replace(/[&<>"']/g, ch => map[ch]);
}

// PAS: WHY a source badge on every fact: real, assumed, illustrative and simulated data must look different
function badge(tag) {
  const names = { P: 'Public', R: 'Regulation', A: 'Assumed', I: 'Illustrative', S: 'Simulated' };
  return `<span class="badge ${tag === 'S' ? 'sim' : ''}" title="Source: ${names[tag]}">${names[tag]}</span>`;
}

// "Needs my decision": open cases that Anke has neither confirmed nor handed to someone
function needsMyDecision(c) {

}

function initials(personId) {

}

function cellHtml(c) {
  const dim = state.mineOnly && !needsMyDecision(c) ? 'dim' : '';

function renderTriage() {
  const cases = allCases();
  const chips = LEVELS.map(level => {
    const count = cases.filter(c => c.colour === level).length;
    return `<span class="chip"><span class="lv lv-${level}"></span> ${LEVEL_LABEL[level]} <b>${count}</b></span>`;
  }).join('');

  categories.forEach(category => {

}

}

function renderCase(id) {
  const c = state.cases[id];

function decisionHtml(c, allChecked, checkedText) {
  const suggestion = suggestOwner(c);
  const notApplicable = c.colour === 'greenOutline';
  const changeOptions = ['red', 'orange', 'green'].map(level =>
    `<option value="${level}" ${level === c.colour ? 'selected' : ''}>${LEVEL_LABEL[level]}</option>`).join('');
  const signButton = notApplicable
    ? `<button class="btn ghost" ${allChecked ? '' : 'disabled'} onclick="signCase('${c.id}')">Sign off as Jonas Richter (simulated)</button>`
    : '';
  const changeRow = notApplicable ? '' : `
      <dt>Change</dt>
      <dd class="row"><select id="change-level">${changeOptions}</select>
        <button class="btn ghost" onclick="changeCase('${c.id}')">Change readiness</button></dd>`;
  return `
    <div class="card">
      <div class="label">Decision · Anke Weber, Q&R Manager</div>
      <div class="row" style="margin: 8px 0">
        <button class="btn" ${allChecked && !c.confirmed ? '' : 'disabled'} onclick="confirmCase('${c.id}')">${c.confirmed ? 'Confirmed' : 'Confirm'}</button>
        <button class="btn ghost" onclick="sendToExpert('${c.id}')">Send to expert</button>

        ${changeRow}

        </dd>
      </dl>
    </div>`;
}

function toggleChecked(evidenceId) {

}

function confirmCase(id) {

}

function changeCase(id) {

}

function overrideCase(id) {

// ---- Screen 4 · Routing: who takes it next?

function renderRouting() {
  const unowned = allCases().filter(c => c.colour !== 'green' && !c.owner).length;
  const groups = caseGroups().map(groupHtml).join('');
  return `
    <div class="label">Triage · who takes it?</div>
    <h1>Routing</h1>
    <p class="lead">Open cases, grouped by the AI's reason. Each group gets a suggested owner with the reason; change any of them. A case cannot leave triage without an owner.</p>
    <div class="row" style="margin-bottom: 16px">
      <button class="btn" onclick="routeAllRed()">Route all red</button>
      <span class="muted">${plural(unowned, 'open case')} without an owner</span>
      <a class="btn ghost" href="#handover" style="margin-left: auto">Go to handover</a>
    </div>
    ${groups || '<p class="muted">Nothing open.</p>'}`;
}

function groupHtml(g) {
  const first = g.cases[0];
  const suggestion = suggestOwner(first);
  const products = [...new Set(g.cases.map(c => product(c.productId).name))];
  const owners = [...new Set(g.cases.map(c => c.owner))];
  const sharedOwner = owners.length === 1 ? owners[0] : null;
  let status = '';
  if (sharedOwner) status = `<b>✓ Routed to ${personName(sharedOwner)}</b>`;
  else if (owners.some(Boolean)) status = '<span class="muted">Partly routed</span>';
  const r = requirement(first.reqId);
  // Red groups open the new-SOP starter; "not applicable" groups open the sign-off
  let panelLabel = '';
  if (g.colour === 'red' && r.starter && !first.ai.productChange) panelLabel = 'New-SOP starter';
  if (g.colour === 'greenOutline') panelLabel = 'Evidence and sign-off';
  const isOpen = state.openGroup === g.key;
  let panel = '';
  if (isOpen && g.colour === 'red') panel = sopStarterHtml(r);
  if (isOpen && g.colour === 'greenOutline') panel = signOffHtml(g);
  return `
    <div class="card">
      <div class="row">
        <span class="lv lv-${g.colour}"></span><b>${g.label}</b>
        <span class="small muted">${LEVEL_LABEL[g.colour]} · ${plural(g.cases.length, 'case')}</span>
        ${groupDeadline(g)}
      </div>
      <p class="small muted">${products.join(', ')}</p>
      <div class="row">
        <span>Suggested: <b>${personName(suggestion.owner)}</b> · ${suggestion.reason}</span>
        <button class="btn ghost" onclick="assignGroup('${g.key}', '${suggestion.owner}')">Accept</button>
        <select onchange="assignGroup('${g.key}', this.value)">${ownerOptions(sharedOwner)}</select>
        ${status}
        ${panelLabel ? `<button class="btn ghost" style="margin-left: auto" onclick="toggleGroup('${g.key}')">${isOpen ? 'Close' : panelLabel}</button>` : ''}
      </div>
      ${panel}
    </div>`;
}

function sopStarterHtml(r) {
  const s = r.starter;
  const mode = state.starterMode[r.id] || s.mode;
  const request = state.sopRequests.find(q => q.reqId === r.id);
  const outline = Object.entries(s.outline).map(([heading, text]) => `<dt>${heading}</dt><dd>${text}</dd>`).join('');
  const action = request
    ? `<b>✓ SOP request sent: ${request.action}</b>`
    : `<button class="btn" onclick="requestSop('${r.id}')">Create SOP request</button>`;
  return `
    <div class="card sim" style="margin: 12px 0 0">
      <div class="label">New-SOP starter · AI draft, not approved ${badge('S')}</div>
      <dl class="form">
        <dt>Action</dt>
        <dd><select onchange="setStarterMode('${r.id}', this.value)">
          <option value="extend" ${mode === 'extend' ? 'selected' : ''}>Extend ${s.extendSop}</option>
          <option value="create" ${mode === 'create' ? 'selected' : ''}>Create new ${s.newSop}</option>
        </select></dd>
        <dt>Owner</dt><dd>${personName(s.owner)}</dd>
        <dt>Approver</dt><dd>${personName(s.approver)}</dd>
        ${outline}
      </dl>
      ${action}
    </div>`;
}

// PAS: WHY a group sign-off checks the shared reason once (e.g. the Art. 77 scope) and applies it to every case in the group
function groupEvidenceIds(g) {
  const first = g.cases[0];
  const p = product(first.productId);
  // No-battery groups rest on each product's fact; requirement groups rest on the regulation text
  if (!p.hasBattery) return [...new Set(g.cases.map(c => productEvidenceId(product(c.productId))))];
  return evidenceIds(first).filter(id => id !== productEvidenceId(p));
}

function signOffHtml(g) {
  const ids = groupEvidenceIds(g);
  const allChecked = ids.every(id => state.checked[id]);
  return `
    <div style="margin-top: 12px">
      ${ids.map(evidenceHtml).join('')}
      <button class="btn" ${allChecked ? '' : 'disabled'} onclick="signGroup('${g.key}')">Sign off ${plural(g.cases.length, 'case')} as Jonas Richter (simulated)</button>
      ${allChecked ? '' : '<span class="small muted">Tick every card to unlock.</span>'}
    </div>`;
}

function findGroup(key) {
  return caseGroups().find(g => g.key === key);
}

function toggleGroup(key) {
  state.openGroup = state.openGroup === key ? null : key;
  render();
}

function assignGroup(key, personId) {
  const g = findGroup(key);
  g.cases.forEach(c => { c.owner = personId || null; });
  addLog('Anke Weber', `Routed ${plural(g.cases.length, 'case')} (${g.label}) to ${personName(personId)}`);
  render();
}

function routeAllRed() {
  const red = allCases().filter(c => c.colour === 'red' && !c.owner);
  red.forEach(c => { c.owner = suggestOwner(c).owner; });
  addLog('Anke Weber', `Routed all ${plural(red.length, 'red case')} to their suggested owners`);
  render();
}

function setStarterMode(reqId, mode) {
  state.starterMode[reqId] = mode;
}

function requestSop(reqId) {
  const s = requirement(reqId).starter;
  const mode = state.starterMode[reqId] || s.mode;
  const action = mode === 'extend' ? `Extend ${s.extendSop}` : `Create ${s.newSop}`;
  state.sopRequests.push({ reqId, action, owner: s.owner, approver: s.approver });
  addLog('Anke Weber', `SOP request for ${reqId}: ${action}; owner ${personName(s.owner)}, approver ${personName(s.approver)}`);
  render();
}

function signGroup(key) {
  const g = findGroup(key);
  signOff(g.cases);
  state.openGroup = null;
  render();
}

// ---- Screen 5 · Handover: into the Emergency Room (Detailed SOP Compliance Assessment)

function renderHandover() {
  const cases = allCases();
  const unowned = cases.filter(c => c.colour !== 'green' && !c.owner).length;
  const unsigned = cases.filter(c => c.colour === 'greenOutline').length;
  // PAS: DEMO the handover stays locked until every case has an owner and every "not applicable" is signed
  const locked = unowned > 0 || unsigned > 0;
  const outputs = locked ? '' : erCasesHtml() + sopRequestsHtml() + routedHtml();
  return `
    <div class="label">Emergency Room · handover</div>
    <h1>Handover</h1>
    <p class="lead">Triage ends here. Orange cases go to the Detailed SOP Compliance Assessment with the scope pre-filled; red cases leave as SOP requests or R&D changes.</p>
    <div class="card">
      <div class="label">Gate</div>
      <p>${unowned === 0 ? '✓' : '✗'} Every open case has an owner <span class="muted">(${unowned} without)</span></p>
      <p>${unsigned === 0 ? '✓' : '✗'} Every "not applicable" is signed <span class="muted">(${unsigned} waiting)</span></p>
      ${locked ? '<a class="btn" href="#routing">Finish in routing</a>' : '<b>Handover unlocked.</b>'}
    </div>
    ${outputs}
    ${auditLogHtml()}`;
}

// PAS: WHY ER cases mirror REMATIQ's Overview screen (Type, Regulatory documents, SOP documents, Process scope) so they drop straight in
function erCasesHtml() {
  const bySop = {};
  allCases().filter(c => c.colour === 'orange').forEach(c => {
    const sop = sopCovering(c.reqId);
    const key = sop ? sop.id : 'none';
    bySop[key] = bySop[key] || [];
    bySop[key].push(c);
  });
  const cards = Object.entries(bySop).map(([sopId, cases]) => {
    const sop = DATA.sops.find(s => s.id === sopId);
    const reqs = [...new Set(cases.map(c => c.reqId))].map(requirement);
    const products = [...new Set(cases.map(c => product(c.productId).name))];
    const owners = [...new Set(cases.map(c => personName(c.owner)))];
    return `
      <div class="card">
        <div class="label">Detailed Assessment · Overview · pre-filled</div>
        <dl class="form">
          <dt>Type</dt><dd>SOP Compliance Assessment</dd>
          <dt>Regulatory documents</dt><dd>${DATA.regulation.code}: ${reqs.map(r => `${r.article} ${r.title}`).join(', ')}</dd>
          <dt>SOP documents</dt><dd>${sop ? `${sop.id} ${sop.title}` : 'To be chosen'}</dd>
          <dt>Process scope</dt><dd>${products.length} products: ${products.join(', ')}</dd>
          <dt>Owner</dt><dd>${owners.join(', ')}</dd>
        </dl>
      </div>`;
  }).join('');
  return `<h2>Cases for the Emergency Room</h2>${cards || '<div class="card muted">No orange cases.</div>'}`;
}

function sopRequestsHtml() {
  const requests = [...state.sopRequests].sort((a, b) => personName(a.owner).localeCompare(personName(b.owner)));
  const rows = requests.map(q => `
    <tr><td>${personName(q.owner)}</td><td>${q.action}</td><td>${q.reqId} ${requirement(q.reqId).title}</td><td>${personName(q.approver)}</td></tr>`).join('');
  const body = rows
    ? `<table class="list"><tr><th>Owner</th><th>Request</th><th>Requirement</th><th>Approver</th></tr>${rows}</table>`
    : '<p class="muted">No SOP requests yet. Open the new-SOP starter on a red group in Routing.</p>';
  return `<h2>SOP requests per owner</h2><div class="card">${body}</div>`;
}

function routedHtml() {
  const rows = caseGroups().filter(g => g.colour === 'red' || g.colour === 'purple').map(g => {
    const owners = [...new Set(g.cases.map(c => personName(c.owner)))];
    return `
      <tr><td><span class="lv lv-${g.colour}"></span> ${g.label}</td><td>${owners.join(', ')}</td>
      <td>${g.cases.length}</td><td>${suggestOwner(g.cases[0]).reason}</td></tr>`;
  }).join('');
  return `
    <h2>Other routed cases</h2>
    <div class="card"><table class="list">
      <tr><th>Case group</th><th>Owner</th><th>Cases</th><th>Why</th></tr>${rows}
    </table></div>`;
}

// PAS: WHY the audit log: signed decisions are the evidence for "why did you decide this does not apply?"
function auditLogHtml() {
  // esc() because the override reason is typed by the user
  const rows = state.log.map(entry => `
    <tr><td class="small muted">${entry.time}</td><td>${esc(entry.actor)}</td><td>${esc(entry.text)}</td></tr>`).join('');
  const body = rows
    ? `<table class="list"><tr><th>Time</th><th>Who</th><th>What</th></tr>${rows}</table>`
    : '<p class="muted">No entries yet.</p>';
  return `<h2>Audit log</h2><div class="card">${body}</div>`;
}

// PAS: SECTION 6 · Router
// PAS: WHY hash links: every screen has its own address so the presenter can jump, and it works from disk
const SCREENS = {
  intake: renderIntake,
  triage: renderTriage,
  case: renderCase,
  routing: renderRouting,
  handover: renderHandover,
};

// PAS: WHY screens return HTML strings: all text comes from DATA in this file; the one typed field (override reason) is escaped with esc()
function render() {
  const [name, arg] = location.hash.replace('#', '').split('/');
  const screen = SCREENS[name] ? name : 'intake';
  document.getElementById('app').innerHTML = SCREENS[screen](arg);
  // The case review belongs to the triage board, so the board stays highlighted in the nav
  const navTarget = screen === 'case' ? 'triage' : screen;
  document.querySelectorAll('nav a').forEach(link => {
    link.classList.toggle('active', link.getAttribute('href') === '#' + navTarget);
  });
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});
render();
</script>
</body>
</html>
