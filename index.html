<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Assessment · Prototype</title>
<link rel="icon" href="assets/icon.svg">
<style>
/* PAS: SECTION 1 · Styles */
/* PAS: WHY colour is reserved for the five readiness levels and for AI (blue); everything else stays neutral */
:root {
  --bg: #f2f0f6; --card: #fff; --ink: #2e1a33; --muted: #74687a; --line: #e4e0ea;
  --red: #d64541; --orange: #ea8a2a; --purple: #7c55c8; --green: #2e9b68;
  --ai: #1f5fd1; --ai-bg: #eef3fd;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
h1 { font-size: 24px; margin: 4px 0 12px; }
h2 { font-size: 17px; margin: 4px 0 8px; }
h3 { font-size: 14px; margin: 0 0 8px; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 64px; }

.topbar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 16px; background: var(--ink); color: #fff; }
.topbar nav { display: flex; flex-wrap: wrap; gap: 4px; }
.topbar nav a { padding: 4px 10px; border-radius: 6px; text-decoration: none; opacity: .7; }
.topbar nav a.active { background: rgba(255, 255, 255, .16); opacity: 1; }
.account { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 13px; line-height: 1.3; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 16px; background: #fff; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.legend button { margin-left: auto; }

.label { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 760px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.big { font-size: 30px; font-weight: 700; line-height: 1.1; }
.card { background: var(--card); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(46, 26, 51, .06); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
.split { display: grid; gap: 14px; grid-template-columns: 290px 1fr; align-items: start; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.crumbs { margin-bottom: 10px; }
.grid3 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); margin: 12px 0; }
.progress { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--bg); margin: 6px 0; }
.status { display: inline-block; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }

.btn { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .3; cursor: not-allowed; }
select, textarea { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
textarea { width: 100%; min-height: 50px; margin-bottom: 6px; }

/* PAS: WHY AI output and human decisions each have one fixed look, used everywhere: blue = AI, dark = human */
.ai { border-left: 4px solid var(--ai); background: var(--ai-bg); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; }
.human { border-left: 4px solid var(--ink); background: #fff; border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(46, 26, 51, .06); }
.ai-chip, .human-chip, .badge { display: inline-block; font: 10px/16px var(--mono); text-transform: uppercase; padding: 0 6px; border-radius: 4px; white-space: nowrap; vertical-align: middle; text-decoration: none; }
.ai-chip { background: var(--ai); color: #fff; }
.human-chip { background: var(--ink); color: #fff; }
.badge { border: 1px solid var(--line); color: var(--muted); }
a.badge:hover { border-color: var(--ink); color: var(--ink); }
.chip { display: inline-block; padding: 0 8px; border-radius: 999px; background: var(--bg); font: 11px/18px var(--mono); white-space: nowrap; }
.chip.overdue { background: var(--ink); color: #fff; }

/* Readiness levels: .lv is a small swatch; the colour classes come last so they win */
.lv { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 2px solid transparent; vertical-align: middle; flex: none; }
.lv-red { background: var(--red); }
.lv-orange { background: var(--orange); }
.lv-purple { background: var(--purple); }
.lv-greenOutline { background: #fff; border-color: var(--green); }
.lv-green { background: var(--green); }

.reqitem { display: block; padding: 8px 10px; border-radius: 10px; text-decoration: none; }
.reqitem:hover { background: var(--bg); }
.reqitem.active { background: var(--bg); box-shadow: inset 3px 0 0 var(--ink); }
.bar { display: flex; gap: 2px; margin: 5px 0 2px; }
.bar span { flex: 1; height: 6px; border-radius: 2px; border: 1px solid transparent; }
.bar .lv-greenOutline { border-color: var(--green); }

.ev { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.ev.checked { border-color: var(--ink); }
.ev blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); }
.todo { margin: 6px 0; padding: 6px 10px; border: 1px dashed var(--muted); border-radius: 8px; font-style: italic; }

.teams { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); margin: 8px 0; }
.team { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; cursor: pointer; font-size: 13px; }
.team.picked { border: 2px solid var(--ink); }
.comment { border-top: 1px solid var(--line); padding: 6px 0; }
tr.section td { background: var(--bg); }
.bulkbar { position: sticky; top: 0; z-index: 1; background: #fff; padding: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 6px; }

table.list { width: 100%; border-collapse: collapse; }
table.list th, table.list td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.list th { font: 11px var(--mono); text-transform: uppercase; color: var(--muted); font-weight: normal; }
dl.form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 6px 0; }
dl.form dt { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 2px; }
dl.form dd { margin: 0; }

@media (max-width: 800px) {
  .split { grid-template-columns: 1fr; }
  .account { margin-left: 0; }
  dl.form { grid-template-columns: 1fr; }
}
</style>
</head>

// PAS: SECTION 3 · Rules: applicability, readiness, deadline, routing
// PAS: WHY this order is also the sort order: most urgent first, done last
const LEVELS = ['red', 'orange', 'purple', 'greenOutline', 'green'];
// PAS: WHY labels say where the case stands and what happens next, in plain words
const LEVEL_LABEL = {
  red: 'Gap: no SOP covers it',
  orange: 'SOP found, detailed check needed',
  purple: 'Unclear: expert decides',
  greenOutline: 'Not applicable: awaiting sign-off',
  green: 'Done',
};

function daysLeft(iso) { return Math.round((Date.parse(iso) - Date.parse(DATA.today)) / 86400000); }
function sopCovering(reqId) { return DATA.sops.find(s => s.covers.includes(reqId)); }

// PAS: WHY dates already passed show "overdue" instead of a negative number
function deadlineChip(iso) {
  const days = daysLeft(iso);
  return days < 0 ? '<span class="chip overdue">overdue</span>' : `<span class="chip">${days} days</span>`;
}

// PAS: SIMULATED the "AI call" is a fixed rule plus fixed reasoning text, no model call
function aiCall(p, r) {
  // PAS: WHY no battery means not applicable for every requirement: the regulation only reaches batteries
  if (!p.hasBattery) {
    return { applies: false, colour: 'greenOutline', reasoning: `${p.name} has no battery (${p.battery}). The Battery Regulation does not reach it.` };
  }
  // PAS: WHY R7 and R8 are not applicable: they cover other battery types, never portable ones
  if (r.portable === 'not-applicable') {
    return { applies: false, colour: 'greenOutline', reasoning: `${p.name} has a portable battery. ${r.article} only covers ${r.scopeText}.` };
  }
  if (r.id === 'R5') return removabilityCall(p);
  return readinessCall(p, r);
}

function removabilityCall(p) {
  // PAS: WHY a battery that is already user-changeable likely meets Art. 11 by design
  if (p.userChangeable) {
    return { applies: true, colour: 'green', reasoning: `The battery in ${p.name} is already user-changeable, so Art. 11 is likely met by design.` };
  }
  // PAS: WHY built-in battery on a continuously used device: an exemption may apply, an expert decides
  if (p.continuousUse) {
    return { applies: true, colour: 'purple', reasoning: `${p.name} has a built-in battery and is used continuously. Art. 11(3) exempts products that need continuity of power supply and a permanent battery connection for safety or data integrity; Regulatory Affairs must decide whether that covers it.` };
  }
  // PAS: WHY otherwise removability applies and the fix is a design change, so the case goes to R&D
  return { applies: true, colour: 'red', productChange: true,
    reasoning: `${p.name} has a built-in battery and no exemption is in sight. Making it removable is a product change, not a document change.` };
}

function readinessCall(p, r) {
  const sop = sopCovering(r.id);
  // PAS: WHY no SOP addresses the requirement: red, someone must write or extend one
  if (!sop) return { applies: true, colour: 'red', reasoning: `${r.title} applies to the battery in ${p.name}. No SOP in the library addresses it.` };
  // PAS: WHY an SOP that already passed a detailed assessment means done
  if (sop.assessed.includes(r.id)) {
    return { applies: true, colour: 'green', reasoning: `${r.title} applies to ${p.name}. ${sop.id} covers it and passed a Detailed Assessment.` };
  }
  return { applies: true, colour: 'orange', reasoning: `${r.title} applies to ${p.name}. ${sop.id} addresses it, but no Detailed Assessment has checked it yet.` };
}

// PAS: WHY assumed facts lower confidence; an assumed "no battery" is the one fact that could hide a wrong "not applicable"
function confidenceFor(p, call) {
  if (call.colour === 'purple') return 'low';
  if (p.batteryTag !== 'A') return 'high';
  return p.hasBattery ? 'medium' : 'low';
}

function buildCase(p, r) {
  const call = aiCall(p, r);
  call.confidence = confidenceFor(p, call);
  // PAS: DEMO a "not applicable" never rests on an assumed fact: low confidence turns the call purple
  if (call.confidence === 'low' && call.colour !== 'purple') {
    call.colour = 'purple';
    call.reasoning += ' This fact is assumed, not verified, so the AI does not call it not applicable.';
  }
  const c = { id: p.id + '-' + r.id, productId: p.id, reqId: r.id, ai: call, colour: call.colour,
    team: null, assignee: null, routedBy: null, confirmed: null, signed: null, productChange: !!call.productChange };
  // PAS: WHY "not applicable" and "unclear" go straight to Regulatory Affairs: only they can sign off or decide them
  if (c.colour === 'greenOutline' || c.colour === 'purple') { c.team = 'ra'; c.routedBy = 'ai'; }
  return c;
}

function buildCases() {
  const cases = {};
  DATA.products.forEach(p => DATA.requirements.forEach(r => {
    const c = buildCase(p, r);
    cases[c.id] = c;
  }));
  return cases;
}

// PAS: SIMULATED routing suggestion: fixed rules, shown with the reason so a human can judge it
function suggestTeam(c) {
  const r = requirement(c.reqId);
  if (c.productChange && c.colour === 'red') return { team: 'rnd', reason: 'The fix is a product design change, not a document change. Q&R keeps tracking it.' };
  if (c.colour === 'purple') return { team: 'ra', reason: 'Interprets unclear rules and exemptions.' };
  if (c.colour === 'greenOutline') return { team: 'ra', reason: 'Signs off every "not applicable".' };
  const sop = sopCovering(r.id);
  if (c.colour === 'orange' && sop) return { team: sop.team, reason: `Owns ${sop.id}, which addresses this requirement, and runs its Detailed Assessment.` };
  if (c.colour === 'red' && r.starter) return { team: r.starter.team, reason: `Owns ${r.starter.extendSop}, the closest SOP, so writes the extension or the new SOP.` };
  return { team: 'ra', reason: 'No owning SOP found; Regulatory Affairs decides.' };
}

// Evidence on a case: the product facts, the regulation text, and the SOP search
function productEvidenceIds(p) { return p.evidence || ['ev-' + p.id]; }

function requirementEvidenceIds(r) {
  const ids = [].concat(r.evidence);
  if (r.portable === 'not-applicable') ids.push('ev-art3');
  if (r.sopSearch) ids.push('sop-' + r.id);
  return ids;
}

function evidenceIds(c) {
  const p = product(c.productId);
  return p.hasBattery ? productEvidenceIds(p).concat(requirementEvidenceIds(requirement(c.reqId))) : productEvidenceIds(p);
}

// Most cards live in DATA.evidence; SOP searches and product pages without a quote are built here
function getEvidence(id) {
  const stored = DATA.evidence[id];
  if (stored) return { ...stored, url: stored.url || (stored.tag === 'R' ? DATA.regulation.textUrl : null) };
  if (id.startsWith('sop-')) {
    const r = requirement(id.slice(4));
    // PAS: SIMULATED SOP search result over the illustrative SOP library
    return { claim: `SOP search for ${r.short}`, excerpt: `Searched ${DATA.sops.length} SOPs. Closest match: ${r.sopSearch.closest}, ${r.sopSearch.finding}`, location: 'Illustrative SOP library', tag: 'AI' };
  }
  const p = product(id.slice(3));
  if (!p.sku) return { claim: `${p.name}: ${p.battery}`, excerpt: null, note: 'No catalogue match yet. The battery fact is assumed from the product family.', location: 'Not in catalogue', tag: 'A' };
  const note = p.batteryTag === 'A' ? 'The product page does not mention a battery. The fact is assumed from the product family.'
    : `The product page lists it as ${p.use.toLowerCase()} and mentions no battery.`;
  return { claim: `${p.name}: ${p.battery}`, excerpt: null, note, location: `Product page ${p.sku}`, url: p.url, tag: p.batteryTag };
}

// PAS: WHY lists sort by colour first, then by deadline: the most urgent open work comes first
function compareCases(a, b) {
  const byColour = LEVELS.indexOf(a.colour) - LEVELS.indexOf(b.colour);
  return byColour !== 0 ? byColour : requirement(a.reqId).from.localeCompare(requirement(b.reqId).from);
}

// PAS: WHY open cases of one requirement are grouped by outcome: nine products with the same QR-code gap are one decision
function groupKind(c) {
  if (!product(c.productId).hasBattery) return 'no battery';
  return c.productChange && c.colour === 'red' ? 'product change' : '';
}

// Section title for a group: the outcome, made specific where the reason differs
function sectionTitle(g) {
  if (g.kind === 'product change') return 'Gap: needs a product change (R&D)';
  if (g.kind === 'no battery' && g.colour === 'purple') return 'Unclear: "no battery" is only assumed';
  if (g.kind === 'no battery' && g.colour === 'greenOutline') return 'Not applicable: product has no battery';
  if (g.colour === 'greenOutline') return 'Not applicable: covers other battery types only';
  return LEVEL_LABEL[g.colour];
}

function requirementGroups(reqId, includeDone) {
  const groups = [];
  allCases().filter(c => c.reqId === reqId && (includeDone || c.colour !== 'green')).sort(compareCases).forEach(c => {
    const key = `${reqId}|${c.colour}|${groupKind(c)}`;
    let group = groups.find(g => g.key === key);
    if (!group) {
      group = { key, colour: c.colour, kind: groupKind(c), cases: [] };
      groups.push(group);
    }
    group.cases.push(c);
  });
  return groups;
}

// PAS: SECTION 4 · State and helpers
// PAS: WHY state lives in memory only: no database, no browser storage; reload or "Reset demo" starts over
let state = freshState();

function freshState() {
  return {
    user: 'anke',         // who is logged in (demo switcher)
    cases: buildCases(),  // one case per product × requirement
    checked: {},          // evidence id → true once a human ticked "Checked"
    comments: {},         // requirement or case id → list of comments
    picks: {},            // routing key → team picked but not yet routed
    teamsOpen: null,      // routing key whose full team list is open
    selected: {},         // case id → true when its row is ticked for a bulk action
    showHandled: false,   // requirement view: show the cases already handed over
    flash: '',            // one-line confirmation of the last action
    starterMode: {},      // requirement id → 'extend' or 'create'
    sopRequests: [],      // requests created from the new-SOP starter
    mineOnly: false,      // "Only what needs me" filter
    log: [],              // audit log, newest first
  };
}

function resetDemo() {
  state = freshState();
  location.hash = '#home';
  render();
}

function allCases() { return Object.values(state.cases); }
function product(id) { return DATA.products.find(p => p.id === id); }
function requirement(id) { return DATA.requirements.find(r => r.id === id); }
function person(id) { return DATA.people[id]; }
function team(id) { return DATA.teams[id]; }
function me() { return person(state.user); }
function plural(count, word) { return `${count} ${word}${count === 1 ? '' : 's'}`; }
function caseName(c) { return `${product(c.productId).name} × ${c.reqId}`; }
function teamMembers(teamId) { return Object.keys(DATA.people).filter(id => person(id).team === teamId); }
function initials(id) { return person(id).name.split(' ').map(word => word[0]).join(''); }
function now() { return new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

function esc(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text).replace(/[&<>"']/g, ch => map[ch]);
}

function addLog(text) { state.log.unshift({ time: now(), who: me().name, text }); }

// PAS: WHY a source badge on every fact: public, regulation, assumed and illustrative data look different, and link out when they can
function sourceBadge(tag, url) {
  if (tag === 'AI') return '<span class="ai-chip">✦ AI</span>';
  const names = { P: 'Public', R: 'Regulation', A: 'Assumed', I: 'Illustrative' };
  return url ? `<a class="badge" href="${url}" target="_blank" rel="noopener">${names[tag]} ↗</a>` : `<span class="badge">${names[tag]}</span>`;
}

// PAS: DEMO source links carry a text fragment (#:~:text=…): the browser jumps to the quoted words and highlights them
function sourceUrl(ev) {
  if (!ev.url || !ev.highlight) return ev.url;
  return `${ev.url}#:~:text=${encodeURIComponent(ev.highlight).replace(/-/g, '%2D')}`;
}
function requirementSourceUrl(r) { return sourceUrl(getEvidence([].concat(r.evidence)[0])); }
function productSourceUrl(p) { return sourceUrl(getEvidence(productEvidenceIds(p)[0])) || p.url; }

function statusHtml(c) {
  if (c.signed) return humanChip(c.signed.by, 'signed');
  if (c.confirmed) return humanChip(c.confirmed.by, 'confirmed');
  return '<span class="ai-chip">✦ AI</span> <span class="small muted">not yet confirmed</span>';
}

function aiBlock(title, body) {
  return `<div class="ai"><div class="row"><span class="ai-chip">✦ AI suggestion</span><b>${title}</b><span class="small muted">simulated, not validated</span></div>${body}</div>`;
}

function humanChip(by, at) { return `<span class="human-chip">✓ Human</span> <b>${person(by).name}</b> <span class="small muted">${at}</span>`; }

// PAS: WHY "needs me" differs per role: Q&R routes every open case; Regulatory Affairs signs off and decides unclear cases
function needsMe(c) {
  if (me().team === 'ra') return c.team === 'ra' && (c.colour === 'purple' || c.colour === 'greenOutline');
  return c.colour !== 'green' && c.colour !== 'greenOutline' && !c.routedBy;
}

    <tr><td><a href="${reg.url}" target="_blank" rel="noopener"><b>${reg.name}</b></a><div class="small muted">${reg.code}</div></td>
      <td><span class="status">${reg.status}</span> ${sourceBadge('I')}</td><td>${reg.products}</td><td class="small">${reg.action}</td></tr>`).join('');
  const attention = 1 + DATA.regulations.filter(reg => reg.attention).length;

    }).join('');
    return `<tr><td colspan="3" class="label" style="background: var(--bg)">${category}</td></tr>${rows}`;
  }).join('');
  return `
    <div class="label">Overview · ${fmtDate(DATA.today)}</div>
    <h1>Good morning, ${me().name.split(' ')[0]}</h1>
    <div class="grid3">
      <div class="card"><div class="label">Need my attention</div><div class="big">${attention}</div><div class="small muted">regulations</div></div>

    </div>
    <div class="card">
      <h3>Regulations that need my attention</h3>
      <table class="list"><tr><th>Regulation</th><th>Status</th><th>Products affected</th><th>Next step</th></tr>
        <tr><td><a href="#alert"><b>${DATA.regulation.name}</b></a> <span class="status">New alert</span><div class="small muted">${DATA.regulation.code}</div></td>
          <td><span class="ai-chip">✦ AI</span> Applicability detected</td><td><b>${affected} of ${DATA.products.length}</b> · next obligation ${fmtDate(next)} ${deadlineChip(next)}</td>
          <td><a class="btn" href="#alert">Open alert →</a></td></tr>
        ${others}
      </table>
    </div>
    <div class="card">
      <h3>Portfolio · ${DATA.businessUnit}</h3>
      <p class="small muted">Status against the ${DATA.regulation.name}, one bar segment per obligation. Other regulations are not tracked per product in this prototype.</p>
      <table class="list"><tr><th>Product</th><th>Battery</th><th>${DATA.regulation.name}</th></tr>${portfolio}</table>
    </div>`;
}

  const affected = DATA.products.filter(p => p.hasBattery).length;
  const applying = DATA.requirements.filter(r => r.portable === 'applies');
  const next = applying.map(r => r.from).filter(d => daysLeft(d) >= 0).sort()[0];
  const obligations = DATA.requirements.map(r => `
    <tr><td><a href="#assess/${r.id}"><b>${r.id}</b> ${r.title}</a><div class="small muted">${r.topic} · ${r.article}</div></td>
      <td>${fmtDate(r.from)}<br>${deadlineChip(r.from)}</td>
      <td>${r.portable === 'applies' ? 'Applies' : 'Not for portable batteries'} <span class="ai-chip">✦ AI</span></td></tr>`).join('');
  const products = DATA.products.map(p => `
    <tr><td><a href="#product/${p.id}"><b>${p.name}</b></a><div class="small muted">${p.use}</div></td>
      <td>${p.battery} ${sourceBadge(p.batteryTag)}</td>
      <td>${p.url ? `<a href="${productSourceUrl(p)}" target="_blank" rel="noopener">${new URL(p.url).hostname.replace('www.', '')} ${p.sku} ↗</a>` : '<span class="muted">No catalogue match</span>'}</td></tr>`).join('');
  return `
    <div class="crumbs small"><a href="#home">Overview</a> › Regulatory alert · received ${DATA.regulation.received}</div>
    <h1>${DATA.regulation.name} <span class="muted">${DATA.regulation.code}</span></h1>
    <div class="grid">
      <div class="card">
        <div class="label">Products affected</div>
        <div class="big">${affected} of ${total}</div>
        <p class="small muted">Products in ${DATA.businessUnit} with a battery</p>
        <a class="btn" href="#assess">Start Pre-Assessment →</a>
      </div>
      <div class="card">
        <div class="label">Next obligation</div>
        <div class="big">${fmtDate(next)}</div>
        <p class="small muted">${deadlineChip(next)} · source: ${sourceBadge('R', DATA.regulation.url)}</p>
      </div>
    </div>
    ${aiBlock('Applicability detected', `<p>The regulation covers batteries. ${affected} of ${total} products have a battery, so it applies to them.
      Of the ${DATA.requirements.length} obligations below, ${applying.length} apply to portable batteries and ${DATA.requirements.length - applying.length} only cover other battery types.
      Every call is checked by a person in the next step.</p>`)}
    <div class="grid">
      <div class="card">
        <h3>Obligations in this regulation</h3>
        <table class="list"><tr><th>Obligation</th><th>Effective</th><th>For our products</th></tr>${obligations}</table>
      </div>
      <div class="card">
        <h3>Products checked · click one for its details</h3>
        <p class="small muted">Synced from the ${DATA.catalogue.site} catalogue on ${DATA.catalogue.date}: ${DATA.catalogue.scraped} products in ${DATA.catalogue.categories} categories, duplicates removed, ${total} in scope.
          <a href="${DATA.catalogue.url}" target="_blank" rel="noopener">Catalogue ↗</a></p>
        <table class="list"><tr><th>Product</th><th>Battery</th><th>Source</th></tr>${products}</table>
      </div>
    </div>`;
}

// ---- Screen 2 · Assess and route: requirements on the left, drill down on the right

function mostUrgentRequirement() {
  const open = allCases().filter(c => c.colour !== 'green').sort(compareCases);
  return open.length ? open[0].reqId : DATA.requirements[0].id;
}

function requirementNavHtml(activeId) {
  const topics = [...new Set(DATA.requirements.map(r => r.topic))];
  return topics.map(topic => {
    const items = DATA.requirements.filter(r => r.topic === topic).map(r => {
      const cases = allCases().filter(c => c.reqId === r.id).sort(compareCases);
      const open = cases.filter(c => c.colour !== 'green').length;
      const mine = cases.filter(needsMe).length;
      const bar = cases.map(c => `<span class="lv-${c.colour}"></span>`).join('');
      if (state.mineOnly && !mine) return '';
      return `
        <a class="reqitem ${r.id === activeId ? 'active' : ''}" href="#assess/${r.id}">
          <div class="row"><b>${r.id}</b> ${r.short} <span style="margin-left: auto">${deadlineChip(r.from)}</span></div>
          <div class="bar">${bar}</div>
          <div class="small muted">${open} open${mine ? ` · <b>${mine} need you</b>` : ''}</div>
        </a>`;
    }).join('');
    return items.trim() ? `<div class="label" style="margin: 10px 0 4px">${topic}</div>${items}` : '';
  }).join('') || '<p class="muted">Nothing needs you right now.</p>';
}

function renderAssess(reqId, productId) {
  const r = requirement(reqId) || requirement(mostUrgentRequirement());
  const cases = allCases();
  const chips = LEVELS.map(level => `<span class="chip"><span class="lv lv-${level}"></span> ${LEVEL_LABEL[level]} <b>${cases.filter(c => c.colour === level).length}</b></span>`).join('');
  const c = productId && state.cases[productId + '-' + r.id];
  return `
    ${regulationHeaderHtml()}
    <div class="row" style="margin-bottom: 14px">${chips}
      <label style="margin-left: auto"><input type="checkbox" ${state.mineOnly ? 'checked' : ''} onchange="toggleMine()"> <b>Only what needs me</b> (${cases.filter(needsMe).length})</label></div>
    <div class="split">
      <aside class="card">${requirementNavHtml(r.id)}</aside>
      <section>${c ? caseHtml(c) : requirementHtml(r)}</section>
    </div>`;
}

// The next open decisions for the logged-in user, most urgent first
function nextForMe(limit) {
  return DATA.requirements.flatMap(r => requirementGroups(r.id)).filter(g => g.cases.some(needsMe))
    .sort((a, b) => compareCases(a.cases[0], b.cases[0])).slice(0, limit);
}

// PAS: DEMO the regulation header keeps the user in the driver's seat: scope, progress, what is next for me, handover status
function regulationHeaderHtml() {
  const cases = allCases();
  const done = cases.filter(c => c.colour === 'green').length;
  // Cases in the Regulatory Affairs queue still wait for a person, so they do not count as handled
  const withExpert = c => c.team === 'ra' && (c.colour === 'purple' || c.colour === 'greenOutline');
  const routed = cases.filter(c => c.colour !== 'green' && c.routedBy && !withExpert(c)).length;
  const waiting = cases.filter(withExpert).length;
  const open = cases.length - done - routed - waiting;
  const confirmedByMe = cases.filter(c => c.confirmed && c.confirmed.by === state.user).length;
  const unrouted = cases.filter(c => c.colour !== 'green' && !c.routedBy).length;
  const unsigned = cases.filter(c => c.colour === 'greenOutline').length;
  const affected = DATA.products.filter(p => p.hasBattery).length;
  const applying = DATA.requirements.filter(r => r.portable === 'applies');
  const next = applying.map(r => r.from).filter(d => daysLeft(d) >= 0).sort()[0];
  const share = n => `${(100 * n / cases.length).toFixed(1)}%`;
  const todo = nextForMe(3).map(g => {
    const r = requirement(g.cases[0].reqId);
    return `<li><a href="#assess/${r.id}">${r.id} ${r.short}</a> · <span class="lv lv-${g.colour}"></span> ${LEVEL_LABEL[g.colour]}${g.kind ? ` (${g.kind})` : ''} · ${plural(g.cases.length, 'product')} ${deadlineChip(r.from)}</li>`;
  }).join('');
  return `
    <div class="card">
      <div class="crumbs small"><a href="#home">Overview</a> › <a href="#alert">Regulatory alert</a> › Assess and route</div>
      <div class="row"><h2 style="margin: 0">${DATA.regulation.name}</h2><span class="muted">${DATA.regulation.code}</span>
        ${sourceBadge('R', DATA.regulation.textUrl)}<span class="status">Pre-Assessment in progress</span></div>
      <div class="grid3">
        <div><div class="label">Scope</div>
          <div><b>${affected} of ${DATA.products.length}</b> products affected · ${DATA.businessUnit}</div>
          <div><b>${applying.length} of ${DATA.requirements.length}</b> obligations apply to portable batteries</div>
          <div>Next obligation <b>${fmtDate(next)}</b> ${deadlineChip(next)}</div>
          <div class="small muted">Alert received ${DATA.regulation.received} · owner ${person(team('qr').lead).name}, Q&R</div></div>
        <div><div class="label">Progress · ${done + routed} of ${cases.length} cases handled</div>
          <div class="progress"><span style="width: ${share(done)}; background: var(--green)"></span><span style="width: ${share(routed)}; background: var(--ink)"></span></div>
          <div class="small"><span class="lv lv-green"></span> Done ${done} · <span class="lv" style="background: var(--ink)"></span> Routed ${routed} · <span class="lv lv-purple"></span> With Regulatory Affairs ${waiting} · Open ${open}</div>
          <div class="small">You confirmed ${confirmedByMe} · ${cases.filter(needsMe).length} still need you</div></div>
        <div><div class="label">Next for you, ${me().name.split(' ')[0]}</div>
          ${todo ? `<ol style="margin: 4px 0; padding-left: 18px">${todo}</ol>` : '<p>Nothing left for you here.</p>'}</div>
      </div>
      <div class="row small">Handover: ${unrouted === 0 ? '✓' : '✗'} ${unrouted} not routed · ${unsigned === 0 ? '✓' : '✗'} ${unsigned} "not applicable" waiting for sign-off
        <a class="btn ghost small" href="#handover" style="margin-left: auto">Go to handover</a></div>
    </div>`;
}

function toggleMine() {
  state.mineOnly = !state.mineOnly;
  render();
}

function requirementHtml(r) {
  const cases = allCases().filter(c => c.reqId === r.id);
  const affected = cases.filter(c => product(c.productId).hasBattery).length;
  const sop = r.sopSearch ? ` SOP search: closest match ${r.sopSearch.closest}, ${r.sopSearch.finding}` : '';
  // PAS: DEMO routed or finished products leave the open list and move to "Handed over", grouped by team
  const sections = requirementGroups(r.id, true).map(g => ({ ...g, cases: g.cases.filter(needsMe) })).filter(g => g.cases.length).map(sectionHtml).join('');
  const handed = handedOverHtml(cases.filter(c => !needsMe(c)));
  const needsStarter = r.starter && cases.some(c => c.colour === 'red' && !c.productChange);
  return `
    <div class="card">
      <div class="label">${r.id} · ${r.topic} · ${r.article} ${sourceBadge('R', requirementSourceUrl(r))}</div>
      <h2>${r.title}</h2>
      <p>${r.plain}</p>
      <p class="small">Effective ${fmtDate(r.from)} ${deadlineChip(r.from)}</p>
    </div>
    ${aiBlock(r.portable === 'applies' ? `Applies to ${affected} of ${cases.length} products` : 'Not applicable to any product',
      `<p>${r.portable === 'applies' ? `Applies to portable batteries; ${affected} products have one.` : `Only covers ${r.scopeText}; our products have portable batteries or none.`}${sop}</p>`)}
    <div class="card">
      <h3>Products that need you · grouped by outcome</h3>
      ${state.flash ? `<p><b>✓ ${state.flash}</b></p>` : ''}
      ${bulkBarHtml()}
      <table class="list">${caseTableHead('Product')}${sections || '<tr><td colspan="6" class="muted">Nothing here needs you. Every product is handed over or done.</td></tr>'}${handed}</table>
      ${teamsPanelHtml()}
    </div>
    ${needsStarter ? `<div class="card">${sopStarterHtml(r)}</div>` : ''}
    ${commentsHtml(r.id, 'Comments on ' + r.id)}`;
}

// Cases that no longer need me, grouped by where they are now: with a team, or done
function handedOverHtml(cases) {
  if (!cases.length) return '';
  const toggle = `<tr class="section"><td colspan="6"><button class="btn ghost small" onclick="toggleHandled()">${state.showHandled ? 'Hide' : 'Show'} ${plural(cases.length, 'product')} handed over or done</button></td></tr>`;
  if (!state.showHandled) return toggle;
  const groups = {};
  cases.forEach(c => {
    const where = c.colour === 'green' ? 'Done' : `With ${team(c.team).name}`;
    groups[where] = (groups[where] || []).concat(c);
  });
  return toggle + Object.entries(groups).map(([where, list]) => `
    <tr class="section"><td></td><td colspan="5"><b>${where}</b> <span class="small muted">${plural(list.length, 'product')}</span></td></tr>
    ${list.map(c => caseRowHtml(c, 'product')).join('')}`).join('');
}

function toggleHandled() {
  state.showHandled = !state.showHandled;
  render();
}

function sectionHtml(g) {
  const shown = g.cases;
  const suggestion = g.colour === 'green' ? null : suggestTeam(g.cases[0]);
  const unrouted = g.cases.filter(c => !c.routedBy);
  const allTicked = shown.every(c => state.selected[c.id]);
  const routeButton = suggestion && unrouted.length && suggestion.team !== me().team ? `
    <span class="small"><span class="ai-chip">✦ AI</span> Suggests <b>${team(suggestion.team).name}</b>: ${suggestion.reason}</span>
    <button class="btn ghost small" onclick="routeMany('${unrouted.map(c => c.id).join(',')}', '${suggestion.team}')">Route ${unrouted.length} there</button>` : '';
  return `
    <tr class="section"><td><input type="checkbox" title="Tick all in this section" ${allTicked ? 'checked' : ''} onchange="selectMany('${shown.map(c => c.id).join(',')}', this.checked)"></td>
      <td colspan="5"><div class="row"><span class="lv lv-${g.colour}"></span><b>${sectionTitle(g)}</b><span class="small muted">${plural(g.cases.length, 'product')}</span>${routeButton}</div></td></tr>
    ${shown.map(c => caseRowHtml(c, 'product')).join('')}`;
}

// ---- Case rows: the same row on the requirement view and the product page

function caseTableHead(firstColumn) {
  return `<tr><th></th><th>${firstColumn}</th><th>Readiness</th><th>Team</th><th>Decision</th><th>Actions</th></tr>`;
}

function caseRowHtml(c, firstColumn) {
  const p = product(c.productId);
  const r = requirement(c.reqId);
  const first = firstColumn === 'product'
    ? `<a href="#product/${p.id}"><b>${p.name}</b></a><div class="small muted">${p.battery}</div>`
    : `<a href="#assess/${r.id}"><b>${r.id}</b> ${r.title}</a><div class="small muted">${r.article} · ${fmtDate(r.from)}</div>`;
  const owner = c.team ? `${team(c.team).name}${c.assignee ? `<div class="small muted">${person(c.assignee).name}</div>` : ''}` : '<span class="muted">not routed</span>';
  return `
    <tr><td><input type="checkbox" ${state.selected[c.id] ? 'checked' : ''} onchange="toggleSelect('${c.id}')"></td>
      <td>${first}</td><td><span class="lv lv-${c.colour}"></span> ${LEVEL_LABEL[c.colour]}</td><td>${owner}</td><td>${statusHtml(c)}</td>
      <td><div class="row">${rowActionsHtml(c)}<a class="small" href="#assess/${r.id}/${p.id}">Review ›</a></div></td></tr>`;
}

// PAS: DEMO every row can be decided on the spot; the case review is there for the evidence and for overrides
function rowActionsHtml(c) {
  const isExpert = me().team === 'ra';
  const button = (label, action) => `<button class="btn ghost small" onclick="${action}('${c.id}')">${label}</button>`;
  if (c.colour === 'green') return '';
  if (c.colour === 'greenOutline') return isExpert ? button('Sign off', 'signCase') : '<span class="small muted">Awaiting sign-off by Regulatory Affairs</span>';
  if (c.colour === 'purple' && isExpert) return button('Applies', 'resolveApplies') + button('Not applicable', 'signCase');
  // PAS: WHY Regulatory Affairs is the expert, so it never gets "To expert"; it decides here or overrides in the case review
  const toExpert = c.colour === 'purple' || isExpert ? '' : button('To expert', 'sendToExpert');
  return (c.confirmed ? '' : button('Confirm', 'confirmCase')) + toExpert;
}

// ---- Bulk actions on ticked rows

function selectedCases() { return Object.keys(state.selected).filter(id => state.selected[id]).map(id => state.cases[id]); }

function toggleSelect(id) {
  state.selected[id] = !state.selected[id];
  render();
}

function selectMany(ids, on) {
  ids.split(',').forEach(id => { state.selected[id] = on; });
  render();
}

function clearSelection() {
  state.selected = {};
  render();
}

function bulkBarHtml() {
  const ticked = selectedCases();
  if (!ticked.length) return '<p class="small muted">Tick rows to act on several products at once, or use the buttons in each row.</p>';
  const suggestion = suggestTeam(ticked[0]);
  const picked = state.picks.bulk || suggestion.team;
  const options = Object.keys(DATA.teams).filter(id => id !== 'qr')
    .map(id => `<option value="${id}" ${id === picked ? 'selected' : ''}>${team(id).name}${id === suggestion.team ? ' (✦ AI suggested)' : ''}</option>`).join('');
  return `
    <div class="bulkbar row"><b>${ticked.length} ticked</b>
      <button class="btn ghost small" onclick="bulkConfirm()">Confirm</button>
      ${me().team === 'ra' ? '<button class="btn ghost small" onclick="bulkSign()">Sign off not applicable</button>'
        : '<button class="btn ghost small" onclick="bulkExpert()">To expert</button>'}
      <select id="bulk-team" onchange="state.picks.bulk = this.value">${options}</select>
      <button class="btn small" onclick="bulkRoute()">Route</button>
      <button class="btn ghost small" onclick="clearSelection()">Clear</button></div>`;
}

function teamsPanelHtml() {
  if (state.teamsOpen !== 'panel') return '<button class="btn ghost small" style="margin-top: 8px" onclick="showTeams(\'panel\')">Compare teams</button>';
  const first = selectedCases()[0] || allCases().find(c => c.colour !== 'green');
  const suggestion = suggestTeam(first);
  const picked = state.picks.bulk || suggestion.team;
  const cards = Object.keys(DATA.teams).filter(id => id !== 'qr').map(id => teamCardHtml('bulk', id, suggestion, picked)).join('');
  return `<div class="teams">${cards}</div><button class="btn ghost small" onclick="showTeams(null)">Hide teams</button>`;
}

function bulkConfirm() {
  selectedCases().filter(c => !c.confirmed && c.colour !== 'green' && c.colour !== 'greenOutline').forEach(c => record(c, `Confirmed the AI call "${LEVEL_LABEL[c.colour]}".`));
  clearSelection();
}

function bulkSign() { signOff(selectedCases().filter(c => c.colour === 'greenOutline' || c.colour === 'purple')); }

function bulkExpert() {
  if (me().team === 'ra') return;
  selectedCases().filter(c => c.colour === 'red' || c.colour === 'orange').forEach(c => moveToExpert(c));
  clearSelection();
}

function bulkRoute() { routeList(selectedCases().filter(c => c.colour !== 'green'), document.getElementById('bulk-team').value, null); }
function routeMany(ids, teamId) { routeList(ids.split(',').map(id => state.cases[id]), teamId, null); }

// ---- Routing: pick a team, see what it does and how loaded it is, then route

function casesForKey(key) { return [state.cases[key]]; }

function teamCardHtml(key, teamId, suggestion, picked) {
  const t = team(teamId);
  const members = teamMembers(teamId).map(id => person(id).name).join(', ');
  const sops = DATA.sops.filter(s => s.team === teamId).map(s => s.id).join(', ') || 'none';
  const load = allCases().filter(c => c.team === teamId && c.colour !== 'green').length;
  return `
    <div class="team ${teamId === picked ? 'picked' : ''}" onclick="pickTeam('${key}', '${teamId}')">
      <div class="row"><b>${t.name}</b>${teamId === suggestion.team ? '<span class="ai-chip">✦ AI suggested</span>' : ''}</div>
      <div class="small muted">${t.fn} · ${DATA.businessUnit}</div>
      <p class="small" style="margin: 6px 0">${t.does}</p>
      <div class="small">Lead: ${person(t.lead).name}<br>Members: ${members}<br>Owns: ${sops}<br>Open cases now: ${load} · Turnaround: ${t.turnaround}</div>
    </div>`;
}

function routingHtml(key, cases) {
  const first = cases[0];
  const suggestion = suggestTeam(first);
  const routed = cases.every(c => c.routedBy && c.team === first.team);
  if (routed && state.teamsOpen !== key) {
    const who = first.assignee ? person(first.assignee).name : 'team queue';
    const by = first.routedBy === 'ai' ? '<span class="ai-chip">✦ AI auto-routed</span>' : humanChip(first.routedBy, 'routed');
    return `<div class="row">${by} → <b>${team(first.team).name}</b> (${who}) <button class="btn ghost small" onclick="showTeams('${key}')">Change</button></div>`;
  }
  const picked = state.picks[key] || first.team || suggestion.team;
  const routable = Object.keys(DATA.teams).filter(id => id !== 'qr');
  const shown = state.teamsOpen === key ? routable : [picked];
  const assignees = teamMembers(picked).map(id => `<option value="${id}">${person(id).name} · ${person(id).role}</option>`).join('');
  return `
    <div class="small"><span class="ai-chip">✦ AI</span> Suggested team: <b>${team(suggestion.team).name}</b>. Why: ${suggestion.reason}</div>
    <div class="teams">${shown.map(id => teamCardHtml(key, id, suggestion, picked)).join('')}</div>
    <div class="row">
      ${state.teamsOpen === key ? '' : `<button class="btn ghost small" onclick="showTeams('${key}')">Compare all teams</button>`}
      <select id="assignee-${key}"><option value="">${team(picked).name} · team queue</option>${assignees}</select>
      <button class="btn" onclick="routeCases('${key}')">Route ${plural(cases.length, 'case')} to ${team(picked).name}</button>
    </div>`;
}

function pickTeam(key, teamId) {
  state.picks[key] = teamId;
  render();
}

function showTeams(key) {
  state.teamsOpen = key;
  render();
}

function routeCases(key) {
  const cases = casesForKey(key);
  const teamId = state.picks[key] || cases[0].team || suggestTeam(cases[0]).team;
  routeList(cases, teamId, document.getElementById('assignee-' + key).value || null);
}

function routeList(cases, teamId, assignee) {
  if (!cases.length) return;
  cases.forEach(c => { c.team = teamId; c.assignee = assignee; c.routedBy = state.user; });
  state.picks = {};
  state.teamsOpen = null;
  state.selected = {};
  addLog(`Routed ${cases.map(caseName).join(', ')} to ${team(teamId).name}${assignee ? ' (' + person(assignee).name + ')' : ''}`);
  state.flash = `Routed ${plural(cases.length, 'product')} to ${team(teamId).name}. They moved to "Handed over".`;
  render();
}

function sopStarterHtml(r) {
  const s = r.starter;
  const mode = state.starterMode[r.id] || s.mode;
  const request = state.sopRequests.find(q => q.reqId === r.id);
  const outline = Object.entries(s.outline).map(([heading, text]) => `<dt>${heading}</dt><dd>${text}</dd>`).join('');
  if (request) return `<p>${humanChip(request.by, 'SOP request sent')}: ${request.action} → ${team(s.team).name}</p>`;
  return `
    <details style="margin-top: 10px"><summary>New-SOP starter</summary>
      ${aiBlock('SOP outline draft, not approved', `
        <dl class="form">
          <dt>Action</dt><dd><select onchange="setStarterMode('${r.id}', this.value)">
            <option value="extend" ${mode === 'extend' ? 'selected' : ''}>Extend ${s.extendSop}</option>
            <option value="create" ${mode === 'create' ? 'selected' : ''}>Create new ${s.newSop}</option></select></dd>
          <dt>Team</dt><dd>${team(s.team).name}</dd><dt>Approver</dt><dd>${person(s.approver).name}</dd>
          ${outline}
        </dl>`)}
      <button class="btn" onclick="requestSop('${r.id}')">Send SOP request</button>
    </details>`;
}

function setStarterMode(reqId, mode) { state.starterMode[reqId] = mode; }

function requestSop(reqId) {
  const s = requirement(reqId).starter;
  const mode = state.starterMode[reqId] || s.mode;
  const action = mode === 'extend' ? `Extend ${s.extendSop}` : `Create ${s.newSop}`;
  state.sopRequests.push({ reqId, action, team: s.team, approver: s.approver, by: state.user });
  addLog(`SOP request for ${reqId}: ${action} → ${team(s.team).name}, approver ${person(s.approver).name}`);
  render();
}

// ---- Sign-off: only Regulatory Affairs can sign a "not applicable"

// PAS: WHY evidence ticks no longer block a decision; instead every decision records how much evidence was checked
function evidenceNote(c) {
  const ids = evidenceIds(c);
  return `evidence checked ${ids.filter(id => state.checked[id]).length} of ${ids.length}`;
}

function signCase(id) { signOff([state.cases[id]]); }

function signOff(cases) {
  if (!cases.length || me().team !== 'ra') return;
  cases.forEach(c => {
    c.colour = 'green';
    c.team = 'ra';
    c.signed = { by: state.user, at: now() };
    addLog(`${caseName(c)}: signed "not applicable" (${evidenceNote(c)})`);
  });
  state.flash = `Signed "not applicable" for ${plural(cases.length, 'product')}. They moved to "Done".`;
  state.selected = {};
  render();
}

// The expert decides an unclear case applies: it gets its real readiness and the matching team
function resolveApplies(id) {
  const c = state.cases[id];
  if (c.reqId === 'R5') {
    c.colour = 'red';
    c.productChange = true;
  } else {
    c.colour = readinessCall(product(c.productId), requirement(c.reqId)).colour;
  }
  c.team = c.colour === 'green' ? 'ra' : suggestTeam(c).team;
  c.routedBy = state.user;
  decide(c, `Decided it applies: ${LEVEL_LABEL[c.colour]}. Routed to ${team(c.team).name}.`);
}

// ---- Case review: one product × one requirement

function evidenceHtml(id) {
  const ev = getEvidence(id);
  const checked = state.checked[id];
  // PAS: WHY facts without a quote (assumed or not on the page) show a dashed note instead of a fake quote
  const body = ev.excerpt
    ? `<blockquote>“${ev.excerpt}”${ev.translation ? `<div class="small muted">Translation: “${ev.translation}”</div>` : ''}</blockquote>`
    : `<p class="todo">${ev.note || 'Paste exact text from EUR-Lex.'}</p>`;
  const where = ev.url ? `<a href="${sourceUrl(ev)}" target="_blank" rel="noopener">${ev.location} ↗</a>` : ev.location;
  return `
    <div class="ev ${checked ? 'checked' : ''}">
      <div class="row"><b>${ev.claim}</b> ${sourceBadge(ev.tag, sourceUrl(ev))}</div>
      ${body}
      <div class="small muted">Source: ${where} · retrieved ${DATA.catalogue.date}</div>
      <label class="small"><input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleChecked('${id}')"> Checked by me</label>
    </div>`;
}

function toggleChecked(evidenceId) {
  state.checked[evidenceId] = !state.checked[evidenceId];
  render();
}

function caseHtml(c) {
  const p = product(c.productId);
  const r = requirement(c.reqId);
  const ids = evidenceIds(c);
  const checkedCount = ids.filter(id => state.checked[id]).length;
  const route = c.colour === 'purple' && me().team === 'ra' ? `<div class="row">${rowActionsHtml(c)}<span class="small muted">You decide: does it apply?</span></div>`
    : c.colour !== 'greenOutline' ? routingHtml(c.id, [c])
    : me().team === 'ra' ? `<button class="btn" onclick="signCase('${c.id}')">Sign "not applicable"</button> <span class="small muted">${evidenceNote(c)}, recorded with your sign-off</span>`
    : '<p class="small">Waiting for sign-off by <b>Regulatory Affairs</b>. To sign, log in as Jonas Richter (top right).</p>';
  return `
    <div class="crumbs"><a href="#assess/${r.id}">${r.id} ${r.title}</a> › <b>${p.name}</b></div>
    <div class="grid">
      <div class="card"><h3>${p.name}</h3>
        <dl class="form">
          <dt>Product</dt><dd><a href="#product/${p.id}">Open product page</a> · ${p.url ? `<a href="${productSourceUrl(p)}" target="_blank" rel="noopener">${p.sku} ↗</a>` : '<span class="muted">no catalogue match</span>'}</dd>
          <dt>Use</dt><dd>${p.use}</dd>
          <dt>Battery</dt><dd>${p.battery} ${sourceBadge(p.batteryTag)}</dd>
        </dl></div>
      <div class="card"><h3>${r.id} ${r.title}</h3>
        <p class="small">${r.plain} ${sourceBadge('R', requirementSourceUrl(r))}</p>
        <p class="small">Effective ${fmtDate(r.from)} ${deadlineChip(r.from)}</p></div>
    </div>
    ${aiBlock(`<span class="lv lv-${c.ai.colour}"></span> ${LEVEL_LABEL[c.ai.colour]} · confidence ${c.ai.confidence}`, `<p>${c.ai.reasoning}</p>`)}
    <div class="card"><h3>Evidence · ${checkedCount} of ${ids.length} checked</h3>${ids.map(evidenceHtml).join('')}</div>
    ${decisionHtml(c)}
    ${c.colour === 'green' ? '' : `<div class="card"><h3>${c.colour === 'greenOutline' ? 'Sign-off' : c.colour === 'purple' && me().team === 'ra' ? 'Expert decision' : 'Route this case'}</h3>${route}</div>`}
    ${commentsHtml(c.id, 'Comments on this case')}`;
}

function decisionHtml(c) {
  const done = c.signed ? `<p>${humanChip(c.signed.by, c.signed.at)} signed "not applicable".</p>`
    : c.confirmed ? `<p>${humanChip(c.confirmed.by, c.confirmed.at)} ${esc(c.confirmed.text)}</p>` : '';
  const options = ['red', 'orange', 'green'].map(level => `<option value="${level}" ${level === c.colour ? 'selected' : ''}>${LEVEL_LABEL[level]}</option>`).join('');
  return `
    <div class="human">
      <div class="row"><span class="human-chip">✓ Human decision</span><b>${me().name}</b><span class="small muted">${me().role}</span></div>
      ${done}
      <div class="row" style="margin: 8px 0">
        ${rowActionsHtml(c)}
        <span class="small muted">${evidenceNote(c)}; this is recorded with your decision</span>
      </div>
      <details><summary>Change readiness or override applicability</summary>
        <dl class="form">
          <dt>Change</dt><dd class="row"><select id="change-level">${options}</select><button class="btn ghost" onclick="changeCase('${c.id}')">Change readiness</button></dd>
          <dt>Override</dt><dd>
            <textarea id="override-reason" placeholder="Written reason (required)" oninput="document.getElementById('override-btn').disabled = !this.value.trim()"></textarea>
            <button id="override-btn" class="btn ghost" disabled onclick="overrideCase('${c.id}')">${c.colour === 'greenOutline' ? 'Override: it applies' : 'Override: not applicable'}</button></dd>
        </dl>
      </details>
    </div>`;
}

function record(c, text) {
  c.confirmed = { by: state.user, at: now(), text };
  addLog(`${caseName(c)}: ${text} (${evidenceNote(c)})`);
}

function decide(c, text) {
  record(c, text);
  render();
}

function confirmCase(id) {
  const c = state.cases[id];
  decide(c, `Confirmed the AI call "${LEVEL_LABEL[c.colour]}".`);
}

function changeCase(id) {
  const c = state.cases[id];
  const level = document.getElementById('change-level').value;
  const text = `Changed readiness from "${LEVEL_LABEL[c.colour]}" to "${LEVEL_LABEL[level]}".`;
  c.colour = level;
  decide(c, text);
}

// PAS: WHY reversing applicability needs a written reason: it is exactly what an auditor will ask about
function overrideCase(id) {
  const c = state.cases[id];
  const reason = document.getElementById('override-reason').value.trim();
  if (!reason) return;
  const level = c.colour === 'greenOutline' ? 'red' : 'greenOutline';
  const text = `Overrode to "${LEVEL_LABEL[level]}". Reason: ${reason}`;
  c.colour = level;
  c.signed = null;
  if (level === 'greenOutline') { c.team = 'ra'; c.routedBy = state.user; }
  decide(c, text);
}

function moveToExpert(c) {
  c.colour = 'purple';
  c.team = 'ra';
  c.routedBy = state.user;
  record(c, 'Sent to Regulatory Affairs for expert review.');
}

function sendToExpert(id) {
  if (me().team === 'ra') return;
  moveToExpert(state.cases[id]);
  render();
}

// ---- Comments on a requirement or a case

function commentsHtml(key, title) {
  const list = (state.comments[key] || []).map(note => `
    <div class="comment"><b>${person(note.by).name}</b> <span class="small muted">${note.at}</span><div>${esc(note.text)}</div></div>`).join('');
  return `
    <div class="card"><h3>${title}</h3>
      ${list || '<p class="small muted">No comments yet.</p>'}
      <textarea id="comment-${key}" placeholder="Add a comment as ${me().name}"></textarea>
      <button class="btn ghost" onclick="addComment('${key}')">Add comment</button>
    </div>`;
}

function addComment(key) {
  const text = document.getElementById('comment-' + key).value.trim();
  if (!text) return;
  state.comments[key] = (state.comments[key] || []).concat({ by: state.user, at: now(), text });
  addLog(`Commented on ${key}: ${text}`);
  render();
}

// ---- Screen 3 · Handover: into the Detailed SOP Compliance Assessment

function renderHandover() {
  const cases = allCases();
  const unrouted = cases.filter(c => c.colour !== 'green' && !c.routedBy).length;
  const unsigned = cases.filter(c => c.colour === 'greenOutline').length;
  // PAS: DEMO the handover stays locked until every case is routed and every "not applicable" is signed
  const locked = unrouted > 0 || unsigned > 0;
  const outputs = locked ? '' : `<div class="grid">${erCasesHtml()}${followUpHtml()}</div>`;
  return `
    <h1>Handover</h1>
    <p class="lead">Orange cases go to the Detailed SOP Compliance Assessment with the scope pre-filled. Red cases leave as SOP requests or R&D changes.</p>
    <div class="card"><h3>Ready to hand over?</h3>
      <p>${unrouted === 0 ? '✓' : '✗'} Every open case is routed to a team <span class="muted">(${unrouted} not routed)</span></p>
      <p>${unsigned === 0 ? '✓' : '✗'} Every "not applicable" is signed by Regulatory Affairs <span class="muted">(${unsigned} waiting)</span></p>
      ${locked ? '<a class="btn" href="#assess">Continue in Assess and route</a>' : '<b>Handover unlocked.</b>'}
    </div>
    ${outputs}
    <div class="card"><details><summary><b>Audit log</b> · ${state.log.length} entries</summary>${auditLogHtml()}</details></div>`;
}

// PAS: WHY ER cases mirror REMATIQ's Overview screen (Type, Regulatory documents, SOP documents, Process scope) so they drop straight in
function erCasesHtml() {
  const bySop = {};
  allCases().filter(c => c.colour === 'orange').forEach(c => {
    const sop = sopCovering(c.reqId);
    const key = sop ? sop.id : 'none';
    bySop[key] = (bySop[key] || []).concat(c);
  });
  const cards = Object.entries(bySop).map(([sopId, cases]) => {
    const sop = DATA.sops.find(s => s.id === sopId);
    const reqs = [...new Set(cases.map(c => c.reqId))].map(requirement);
    const products = [...new Set(cases.map(c => product(c.productId).name))];
    const teams = [...new Set(cases.map(c => team(c.team).name))];
    return `
      <dl class="form">
        <dt>Type</dt><dd>SOP Compliance Assessment</dd>
        <dt>Regulatory documents</dt><dd>${DATA.regulation.code}: ${reqs.map(r => `${r.article} ${r.title}`).join(', ')}</dd>
        <dt>SOP documents</dt><dd>${sop ? `${sop.id} ${sop.title}` : 'To be chosen'}</dd>
        <dt>Process scope</dt><dd>${products.length} products: ${products.join(', ')}</dd>
        <dt>Team</dt><dd>${teams.join(', ')}</dd>
      </dl>`;
  }).join('<hr>');
  return `<div class="card"><h3>Detailed Assessment · Overview, pre-filled</h3>${cards || '<p class="muted">No orange cases.</p>'}</div>`;
}

function followUpHtml() {
  const requests = state.sopRequests.map(q => `<tr><td>${team(q.team).name}</td><td>${q.action}</td><td>${q.reqId}</td></tr>`).join('');
  // One row per team and outcome, so the same product does not repeat once per requirement
  const rows = {};
  allCases().filter(c => c.colour === 'red' || c.colour === 'purple').forEach(c => {
    const key = `${c.team}|${c.colour}|${groupKind(c)}`;
    rows[key] = rows[key] || { c, reqs: new Set(), products: new Set() };
    rows[key].reqs.add(c.reqId);
    rows[key].products.add(product(c.productId).name);
  });
  const other = Object.values(rows).map(({ c, reqs, products }) => `
    <tr><td>${team(c.team).name}</td><td><span class="lv lv-${c.colour}"></span> ${LEVEL_LABEL[c.colour]}${groupKind(c) ? ` (${groupKind(c)})` : ''}, ${plural(products.size, 'product')}</td><td>${[...reqs].sort().join(', ')}</td></tr>`).join('');
  return `
    <div class="card"><h3>Follow-up per team</h3>
      <table class="list"><tr><th>Team</th><th>What</th><th>Req.</th></tr>${requests}${other}</table>
      ${requests ? '' : '<p class="small muted">No SOP requests sent yet. Use the new-SOP starter on a red requirement.</p>'}
    </div>`;
}

// PAS: WHY the audit log: signed decisions are the evidence for "why did you decide this does not apply?"
function auditLogHtml() {
  // esc() because comments and override reasons are typed by the user
  const rows = state.log.map(entry => `<tr><td class="small muted">${entry.time}</td><td>${esc(entry.who)}</td><td>${esc(entry.text)}</td></tr>`).join('');
  return rows ? `<table class="list"><tr><th>Time</th><th>Who</th><th>What</th></tr>${rows}</table>` : '<p class="muted">No entries yet.</p>';
}

// PAS: SECTION 6 · Router
// PAS: WHY hash links: every screen has its own address so the presenter can jump, and it works from disk
const SCREENS = { home: renderHome, alert: renderAlert, assess: renderAssess, product: renderProduct, handover: renderHandover };

// PAS: WHY screens return HTML strings: all text comes from DATA in this file; typed text (comments, reasons) goes through esc()
function render() {
  const [name, reqId, productId] = location.hash.replace('#', '').split('/');
  const screen = SCREENS[name] ? name : 'home';
  document.getElementById('app').innerHTML = SCREENS[screen](reqId, productId);
  document.getElementById('account').innerHTML = renderAccount();
  document.querySelectorAll('nav a').forEach(link => {
    const navScreen = screen === 'product' ? 'alert' : screen;
    link.classList.toggle('active', link.getAttribute('href') === '#' + navScreen);
  });
}

window.addEventListener('hashchange', () => {
  state.selected = {};
  state.flash = '';
  render();
  window.scrollTo(0, 0);
});
render();
</script>
</body>
</html>
