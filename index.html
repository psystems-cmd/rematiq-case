<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Assessment · Prototype</title>
<link rel="icon" href="assets/icon.svg">
<style>
/* PAS: SECTION 1 · Styles */
/* PAS: WHY colour is reserved for the five triage levels; everything else stays neutral */
:root {
  --bg: #f2f0f6;
  --card: #ffffff;
  --ink: #2e1a33;
  --muted: #74687a;
  --line: #e4e0ea;
  --red: #d64541;
  --orange: #ea8a2a;
  --purple: #7c55c8;
  --green: #2e9b68;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: inherit; }
h1 { font-size: 26px; margin: 4px 0; }
h2 { font-size: 18px; margin: 24px 0 8px; }
.card h2 { margin-top: 4px; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }

.banner { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 8px 16px; background: var(--ink); color: #fff; font: 12px var(--mono); }
.banner nav { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.banner nav a { padding: 2px 10px; border-radius: 6px; text-decoration: none; opacity: .7; }
.banner nav a.active { background: rgba(255, 255, 255, .18); opacity: 1; }
.banner button { font: inherit; color: #fff; background: none; border: 1px solid rgba(255, 255, 255, .5); border-radius: 6px; padding: 2px 10px; cursor: pointer; }

.label { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.big { font-size: 34px; font-weight: 700; line-height: 1.1; margin-top: 8px; }
.card { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(46, 26, 51, .06); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { font: inherit; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .3; cursor: not-allowed; }
select, textarea { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
textarea { width: 100%; min-height: 56px; }

.badge { font: 10px var(--mono); text-transform: uppercase; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); white-space: nowrap; vertical-align: middle; }
/* PAS: WHY simulated output gets a hatched background so it never looks like validated data */
.badge.sim, .sim { background: repeating-linear-gradient(135deg, #fff 0 6px, #f1edf5 6px 12px); }
.badge.sim { border-color: var(--ink); color: var(--ink); }
.sim { border: 1px dashed var(--ink); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--bg); font: 11px var(--mono); white-space: nowrap; }
.chip.overdue { background: var(--ink); color: #fff; }

/* Triage levels: .lv is a small swatch, .cell is a matrix cell; the colour classes come last so they win */
.lv { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 2px solid transparent; vertical-align: middle; }
.cell { display: inline-block; width: 40px; height: 28px; line-height: 24px; border-radius: 6px; border: 2px solid transparent; font: 10px var(--mono); color: #fff; text-decoration: none; }
.cell.dim { opacity: .15; }
.lv-red { background: var(--red); }
.lv-orange { background: var(--orange); }
.lv-purple { background: var(--purple); }
.lv-greenOutline { background: #fff; border-color: var(--green); color: var(--green); }
.lv-green { background: var(--green); }

.scroll { overflow-x: auto; }
.matrix { width: 100%; border-collapse: collapse; font-size: 13px; }
.matrix th, .matrix td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: top; }
.matrix th:first-child, .matrix td:first-child { text-align: left; min-width: 180px; }
.matrix tr.cat td { background: var(--bg); }

.ev { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.ev.checked { border-color: var(--ink); }
.ev blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); }
.todo { margin: 6px 0; padding: 6px 10px; border: 1px dashed var(--muted); border-radius: 8px; font-style: italic; }

table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th, table.list td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
dl.form { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 8px 0; }
dl.form dt { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 3px; }
dl.form dd { margin: 0; }

@media (max-width: 640px) {
  main { padding: 16px 10px 48px; }
  .banner nav { margin-left: 0; }
  dl.form { grid-template-columns: 1fr; }
}
</style>

// PAS: SECTION 3 · Triage rules
// PAS: WHY this order is also the board's sort order: most urgent first, done last
const LEVELS = ['red', 'orange', 'purple', 'greenOutline', 'green'];
const LEVEL_LABEL = {
  red: 'Applies, no SOP',
  orange: 'SOP exists, not assessed',
  purple: 'Unclear, needs expert',
  greenOutline: 'Not applicable, sign-off needed',
  green: 'Done',
};

function daysLeft(iso) {
  return Math.round((Date.parse(iso) - Date.parse(DATA.today)) / 86400000);
}

// PAS: WHY dates already passed show "overdue" instead of a negative number
function deadlineChip(iso) {
  const days = daysLeft(iso);
  return days < 0 ? '<span class="chip overdue">overdue</span>' : `<span class="chip">${days} days</span>`;
}

function sopCovering(reqId) {
  return DATA.sops.find(s => s.covers.includes(reqId));
}

// PAS: SIMULATED the "AI call" is a fixed rule plus fixed reasoning text, no model call
function aiCall(p, r) {
  // PAS: WHY no battery means not applicable for every requirement: the regulation only reaches batteries
  if (!p.hasBattery) {
    return { applies: false, colour: 'greenOutline',
      reasoning: `${p.name} has no battery (${p.battery}). The Battery Regulation does not reach it.` };
  }
  // PAS: WHY R7 and R8 are not applicable: they cover other battery types, never portable ones
  if (r.portable === 'not-applicable') {
    return { applies: false, colour: 'greenOutline',
      reasoning: `${p.name} has a portable battery. ${r.article} only covers ${r.scopeText}.` };
  }
  if (r.id === 'R5') return removabilityCall(p);
  return readinessCall(p, r);
}

function removabilityCall(p) {
  // PAS: WHY a battery that is already user-changeable likely meets Art. 11 by design
  if (p.userChangeable) {
    return { applies: true, colour: 'green',
      reasoning: `The battery in ${p.name} is already user-changeable, so Art. 11 is likely met by design.` };
  }
  // PAS: WHY built-in battery on a continuously used device: an exemption for continuous power may apply, an expert decides
  if (p.continuousUse) {
    return { applies: true, colour: 'purple',
      reasoning: `${p.name} has a built-in battery and is used continuously. Art. 11(3) lists exemptions that may cover it; Regulatory Affairs must decide.` };
  }
  // PAS: WHY otherwise removability applies and the fix is a design change, so the case goes to R&D
  return { applies: true, colour: 'red', productChange: true,
    reasoning: `${p.name} has a built-in battery and no exemption is in sight. Making it removable is a product change, not a document change.` };
}

function readinessCall(p, r) {
  const sop = sopCovering(r.id);
  // PAS: WHY no SOP addresses the requirement: red, someone must write or extend one
  if (!sop) {
    return { applies: true, colour: 'red',
      reasoning: `${r.title} applies to the portable battery in ${p.name}. No SOP in the library addresses it.` };
  }
  // PAS: WHY an SOP that already passed a detailed assessment means done
  if (sop.assessed.includes(r.id)) {
    return { applies: true, colour: 'green',
      reasoning: `${r.title} applies to ${p.name}. ${sop.id} covers it and passed a detailed assessment.` };
  }
  return { applies: true, colour: 'orange',
    reasoning: `${r.title} applies to ${p.name}. ${sop.id} addresses it, but no detailed assessment has checked it yet.` };
}

// PAS: WHY assumed facts lower confidence; an assumed "no battery" is the one fact that could hide a wrong "not applicable"
function confidenceFor(p, call) {
  if (call.colour === 'purple') return 'low';
  if (p.batteryTag !== 'A') return 'high';
  return p.hasBattery ? 'medium' : 'low';
}

function buildCase(p, r) {
  const call = aiCall(p, r);
  call.confidence = confidenceFor(p, call);
  // PAS: DEMO a "not applicable" never rests on an assumed fact: low confidence turns the call purple
  if (call.confidence === 'low' && call.colour !== 'purple') {
    call.colour = 'purple';
    call.reasoning += ' This fact is assumed, not verified, so the AI does not call it not applicable.';
  }
  return { id: p.id + '-' + r.id, productId: p.id, reqId: r.id, ai: call,
    colour: call.colour, owner: null, confirmed: false, signedBy: null };
}

function buildCases() {
  const cases = {};
  DATA.products.forEach(p => {
    DATA.requirements.forEach(r => {
      const c = buildCase(p, r);
      cases[c.id] = c;
    });
  });
  return cases;
}

// Routing rules: who takes the case next, and why
function suggestOwner(c) {
  const r = requirement(c.reqId);
  if (c.colour === 'green') return null;
  // PAS: WHY a product change goes to R&D: the fix is a design change; Q&R keeps tracking it
  if (c.ai.productChange && c.colour === 'red') {
    return { owner: 'tobias', reason: 'Fix is a design change; Q&R keeps tracking it' };
  }
  if (c.colour === 'purple') return { owner: 'jonas', reason: 'Interprets unclear rules' };
  if (c.colour === 'greenOutline') return { owner: 'jonas', reason: 'Signs off not applicable' };
  if (c.colour === 'orange' && sopCovering(r.id)) {
    const sop = sopCovering(r.id);
    return { owner: sop.owner, reason: `Owns ${sop.id}; runs the Detailed Assessment` };
  }
  if (c.colour === 'red' && r.starter) {
    return { owner: r.starter.owner, reason: `Owns ${r.starter.extendSop}` };
  }
  return { owner: 'jonas', reason: 'No SOP owner known; Regulatory Affairs decides' };
}

// Evidence shown on a case: the product fact, the regulation text, and the SOP search
function productEvidenceId(p) {
  return p.evidence || 'ev-' + p.id;
}

function evidenceIds(c) {
  const p = product(c.productId);
  const r = requirement(c.reqId);
  const ids = [productEvidenceId(p)];
  if (!p.hasBattery) return ids;
  ids.push(r.evidence);
  if (r.portable === 'not-applicable') ids.push('ev-art3');
  if (r.sopSearch) ids.push('sop-' + r.id);
  return ids;
}

// Most cards live in DATA.evidence; product facts without a public source and SOP searches are built here
function getEvidence(id) {
  if (DATA.evidence[id]) return DATA.evidence[id];
  if (id.startsWith('sop-')) {
    const r = requirement(id.slice(4));
    // PAS: SIMULATED SOP search result over the illustrative SOP library
    return { claim: `SOP search for ${r.id} ${r.short}`, excerpt: `Searched ${DATA.sops.length} SOPs. Closest match: ${r.sopSearch.closest}, ${r.sopSearch.finding}`,
      location: 'SOP library', tag: 'I', status: 'Illustrative' };
  }
  const p = product(id.slice(3));
  const where = p.sku ? `philips.de catalogue, ${p.sku}` : 'No catalogue match';
  const note = p.batteryTag === 'A' ? 'Assumed from the product family; no public source matched yet.' : `Listed in the philips.de catalogue as ${p.use}.`;
  return { claim: `${p.name}: ${p.battery}`, excerpt: null, note, location: where, tag: p.batteryTag, status: p.batteryTag === 'A' ? 'Assumed' : 'Catalogue listing' };
}

// PAS: SECTION 4 · State and helpers
// PAS: WHY state lives in memory only: no database, no browser storage; reload or "Reset demo" starts over
let state = freshState();

function freshState() {
  return {
    cases: buildCases(),  // one case per product × requirement
    checked: {},          // evidence id → true once a human ticked "Checked"
    sopRequests: [],      // requests created from the new-SOP starter
    starterMode: {},      // requirement id → 'extend' or 'create'
    openGroup: null,      // routing group whose panel is open
    mineOnly: false,      // "Needs my decision" filter on the board
    log: [],              // audit log, newest first
  };
}

function resetDemo() {
  state = freshState();
  location.hash = '#intake';
  render();
}

function allCases() {
  return Object.values(state.cases);
}

function caseName(c) {
  return `${product(c.productId).name} × ${c.reqId}`;
}

function addLog(actor, text) {
  const time = new Date().toLocaleTimeString('en-GB');
  state.log.unshift({ time, actor, text });
}

function product(id) {
  return DATA.products.find(p => p.id === id);
}

function requirement(id) {
  return DATA.requirements.find(r => r.id === id);
}

function personName(id) {
  return id ? DATA.people[id].name : 'nobody';
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

function esc(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(text).replace(/[&<>"']/g, ch => map[ch]);
}

// PAS: WHY a source badge on every fact: real, assumed, illustrative and simulated data must look different
function badge(tag) {
  const names = { P: 'Public', R: 'Regulation', A: 'Assumed', I: 'Illustrative', S: 'Simulated' };
  return `<span class="badge ${tag === 'S' ? 'sim' : ''}" title="Source: ${names[tag]}">${names[tag]}</span>`;
}

// PAS: SECTION 5 · Screens
// Each screen is one function that returns HTML. Buttons call the small action functions next to it.
function placeholder(title) {
  return `<h1>${title}</h1><p class="lead">This screen comes in a later step.</p>`;
}

// ---- Screen 1 · Intake: what just came in?

function nextObligation() {
  const upcoming = DATA.requirements.filter(r => r.portable === 'applies' && daysLeft(r.from) >= 0);
  return upcoming.map(r => r.from).sort()[0];
}

function renderIntake() {
  const total = DATA.products.length;
  const affected = DATA.products.filter(p => p.hasBattery).length;
  const cat = DATA.catalogue;
  const rows = DATA.products.map(p => `
    <tr>
      <td>${p.name}</td>
      <td>${p.sku ? p.sku + ' ' + badge('P') : '<span class="muted">not matched</span>'}</td>
      <td>${p.battery} ${badge(p.batteryTag)}</td>
    </tr>`).join('');
  return `
    <div class="label">Ambulance · what just came in?</div>
    <h1>Intake</h1>
    <p class="lead">A new regulation arrives together with today's product data. Triage decides, for each product, whether it applies, how ready we are and who takes it next.</p>
    <div class="grid">
      <div class="card">
        <div class="label">Regulatory alert · ${DATA.regulation.code}</div>
        <h2>${DATA.regulation.name}</h2>
        <div class="row"><b>Applicability detected</b> ${badge('S')}</div>
        <div class="big">${affected} of ${total}</div>
        <div>products affected</div>
        <p class="small muted">Next obligations effective ${fmtDate(nextObligation())}</p>
        <button class="btn" onclick="startTriage()">Start triage</button>
      </div>
      <div class="card">
        <div class="label">Regulatory alert · ${DATA.otherAlert.name} ${badge('I')}</div>
        <h2>Not applicable</h2>
        <div class="big">0 of ${total}</div>
        <div>products affected</div>
        <p class="small muted">${DATA.otherAlert.reason}</p>
      </div>
    </div>
    <div class="card">
      <div class="label">Product sync · ${cat.site} · ${cat.date}</div>
      <h2>${total} products from ${cat.site}, duplicates removed</h2>
      <p class="small muted">From a catalogue scrape of ${cat.scraped} products in ${cat.categories} top-level categories: the patient monitoring products, with their battery facts.</p>
      <div class="scroll"><table class="list">
        <tr><th>Product</th><th>SKU</th><th>Battery</th></tr>${rows}
      </table></div>
    </div>`;
}

function startTriage() {
  addLog('Anke Weber', `Started triage of ${DATA.regulation.code} for ${DATA.products.length} products`);
  location.hash = '#triage';
}

// PAS: SECTION 6 · Router
// PAS: WHY hash links: every screen has its own address so the presenter can jump, and it works from disk
const SCREENS = {
  intake: renderIntake,
  triage: () => placeholder('Triage board'),
  case: () => placeholder('Case review'),
  routing: () => placeholder('Routing'),
  handover: () => placeholder('Handover'),
};

// PAS: WHY screens return HTML strings: all text comes from DATA in this file; the one typed field (override reason) is escaped with esc()
function render() {
  const [name, arg] = location.hash.replace('#', '').split('/');
  const screen = SCREENS[name] ? name : 'intake';
  document.getElementById('app').innerHTML = SCREENS[screen](arg);
  // The case review belongs to the triage board, so the board stays highlighted in the nav
  const navTarget = screen === 'case' ? 'triage' : screen;
  document.querySelectorAll('nav a').forEach(link => {
    link.classList.toggle('active', link.getAttribute('href') === '#' + navTarget);
  });
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});
render();
</script>
